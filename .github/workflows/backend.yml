name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  comprobar:
    name: Formato, análisis estático y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # PostgreSQL de usar y tirar para las pruebas de la base de datos (issue #40). La contraseña solo
    # vale dentro de esta máquina temporal, que se borra al terminar.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      # Sin PostgreSQL, las pruebas de la base de datos fallan en lugar de saltarse (pruebas/conftest.py).
      REQUIERE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Comprobar el formato
        run: ruff format --check .

      - name: Comprobar el estilo
        run: ruff check .

      - name: Probar el esquema y la carga del curso
        run: ./migraciones/probar.sh

      - name: Ejecutar las pruebas
        run: pytest
