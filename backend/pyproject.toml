[project]
name = "reto480-backend"
# La versión vive en `app/__init__.py` (VERSION); aquí se lee de ahí.
dynamic = ["version"]
description = "API del prototipo de aprendizaje adaptativo · Reto 480 Equipo C"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Acotado por arriba: un salto de versión no debe pasar desapercibido.
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  # Conexión con PostgreSQL (issue #40). La versión "binary" trae su propia libpq: no hace falta
  # compilar nada ni instalar librerías del sistema.
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "app.VERSION"}

[tool.setuptools.packages.find]
include = ["app*"]

# El curso de ejemplo (app/datos/) viaja con el paquete hasta que esté en la base de datos.
[tool.setuptools.package-data]
app = ["datos/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "pruebas"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN"]
# ANN401: se admite Any en utilidades internas.
# N818: en español la convención es "Error de negocio", no "ErrorDeNegocioError".
ignore = ["ANN401", "N818"]

[tool.ruff.lint.per-file-ignores]
"pruebas/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
pythonpath = ["."]
addopts = "-q"
